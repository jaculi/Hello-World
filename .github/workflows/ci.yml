# BC 全门禁（步 25，BP-05 §7.1 预埋）：buf → lint（含 depguard 自定义规则）
# → 单测 → 集成测（testcontainers，RLS 实证）→ 制品构建（签名步骤预留）。
# e2e 标签测试需要完整 docker-compose 栈，当前在本地/dev 环境运行，暂不进本流水线。
name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  buf:
    name: ① 契约门禁（buf lint + breaking）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-action@v1
        with:
          input: api
          lint: true
          format: false
          breaking: true
          push: false
          breaking_against: "https://github.com/${{ github.repository }}.git#branch=master,subdir=api"

  lint:
    name: ② 静态检查（golangci-lint + depguard）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.14"
          cache: true
      - uses: golangci/golangci-lint-action@v8
        with:
          # 不固定小版本：取 action 默认最新版（配置为 v2 格式，需 golangci-lint v2）
          args: --timeout=5m

  unit-test:
    name: ③ 单元测试（go vet + go test）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.14"
          cache: true
      - run: go vet ./...
      - name: ADR-0004 零框架依赖回归（AST）
        run: go test ./internal/verify -v
      - run: go test ./pkg/... ./services/... -v -count=1

  integration-test:
    name: ④ 集成测试（testcontainers RLS 实证）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.14"
          cache: true
      # GitHub runner 自带 Docker；testcontainers 自动拉起 postgres:16-alpine
      - run: go test -tags integration ./pkg/dataaccess -v -count=1

  image-build:
    name: ⑤ 制品构建（distroless，签名预留）
    runs-on: ubuntu-latest
    needs: [lint, unit-test, integration-test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: 构建 tenant-bc 镜像（不推送；签名/推送随制品库接入启用）
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/tenant/Dockerfile
          tags: jsl/tenant-bc:${{ github.sha }}
          push: false
          load: true
      - name: 制品冒烟（容器应能以非 root 启动并监听 8000/9000）
        run: |
          docker run -d --name smoke -p 8000:8000 -e JSL_ENV=dev jsl/tenant-bc:${{ github.sha }}
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/healthz | grep -q SERVING; then
              echo "container smoke OK"; docker logs smoke; exit 0
            fi
            sleep 2
          done
          echo "container smoke FAILED"; docker logs smoke; exit 1
