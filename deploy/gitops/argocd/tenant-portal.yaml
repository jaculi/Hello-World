# ArgoCD Application：tenant-portal（M20 租户门户，Next.js 15 standalone）。
# M23：dev（kind）同步走 deploy/dev/tenant-portal-dev-values.yaml 声明的本地镜像
#       （jsl/tenant-portal:vX + pullPolicy Never，kind load 导入）。
# 生产 overlay（后续）：另建 *-prod Application，helm.parameters 覆盖
#   image.repository=ghcr.io/jaculi/tenant-portal、tag=sha-<commit>（BP-04 §6 制品可追溯）、
#   pullPolicy=Always；GHCR 包为 private，节点需 imagePullSecrets（PAT read:packages），
#   且镜像经 Kyverno cosign 验签（CI 已 keyless 签名，Fulcio 发行者 GitHub Actions）。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tenant-portal
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: jsl-platform
spec:
  project: default
  source:
    repoURL: https://github.com/jaculi/Hello-World.git
    targetRevision: master
    path: deploy/helm/tenant-portal
    helm:
      valueFiles:
        - ../../../deploy/dev/tenant-portal-dev-values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
