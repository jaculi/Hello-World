# ArgoCD Application：tenant-bc（ADR-0004 决策 3 / BP-04 §6 GitOps）。
# M23：dev（kind）同步走 deploy/dev/tenant-bc-dev-values.yaml 本地镜像。
# 生产 overlay（后续）：helm.parameters 覆盖 GHCR（sha-<commit> + Always + imagePullSecrets，
#   Kyverno cosign 验签）；同 tenant-portal 的 prod 变体。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tenant-bc
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: jsl-platform
spec:
  project: default
  source:
    repoURL: https://github.com/jaculi/Hello-World.git
    targetRevision: master
    path: deploy/helm/tenant-bc
    helm:
      valueFiles:
        - ../../../deploy/dev/tenant-bc-dev-values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
