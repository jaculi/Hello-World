# 身份基础设施命名空间（M18）。
# 必须带 Kyverno 命名空间策略要求的三枚标签（require-namespace-labels），
# 否则 ArgoCD CreateNamespace 会被准入拒绝。
apiVersion: v1
kind: Namespace
metadata:
  name: keycloak
  labels:
    app.kubernetes.io/part-of: jsl-platform
    jsl-platform/team: platform
    jsl-platform/environment: dev
    jsl-platform/cost-center: platform-identity
    jsl-platform/network-policy: default-deny
    jsl-platform/resource-quota: enforced
---
apiVersion: v1
kind: Namespace
metadata:
  name: apisix
  labels:
    app.kubernetes.io/part-of: jsl-platform
    jsl-platform/team: platform
    jsl-platform/environment: dev
    jsl-platform/cost-center: platform-gateway
    jsl-platform/network-policy: default-deny
    jsl-platform/resource-quota: enforced
