# BC-P1 dev 依赖栈 + 身份基础设施（M18）：
#   PostgreSQL（RLS）、Kafka（KRaft 单节点）、Keycloak（OIDC）、APISIX（网关）、tenant-bc
# 用法：docker compose -f deploy/dev/docker-compose.yml up -d
name: jsl-tenant-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jsl
      POSTGRES_PASSWORD: jsl
      POSTGRES_DB: jsl
    ports:
      - "15432:5432" # 宿主 15432（5432 常被本地实例占用）
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jsl -d jsl"]
      interval: 2s
      timeout: 3s
      retries: 30

  kafka:
    image: apache/kafka:3.9.1
    environment:
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  # ── M18 身份基础设施 ─────────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: "true"
      # M19：锁定浏览器面 hostname（全 URL），使所有令牌 iss 固定为 http://localhost:9080/realms/jsl，
      # 与 BC 验签 issuer / 门户 Auth.js discovery 一致（经 APISIX :9080 访问）。
      # Keycloak 26 接受全 URL 或纯 hostname；"localhost:9080" 二者皆非会报错。
      KC_HOSTNAME: "http://localhost:9080"
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8081:8080" # 宿主 8081：Keycloak 管理台/发现端点
    volumes:
      - ../identity/keycloak/jsl-realm.json:/opt/keycloak/data/import/jsl-realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '\"status\": *\"UP\"'"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 90s

  apisix:
    image: apache/apisix:3.11.0-debian
    volumes:
      - ../gateway/apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ../gateway/apisix/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
    ports:
      - "9080:9080" # 网关统一入口：/api/* 走 OIDC，/realms/* 代理 Keycloak
    depends_on:
      keycloak:
        condition: service_healthy
      tenant-bc:
        condition: service_started

  tenant-bc:
    build:
      context: ../..
      dockerfile: services/tenant/Dockerfile
    environment:
      JSL_ENV: "dev" # 无 JSL_DB_DSN 走内存替身；M19 seed demo 租户
      JSL_KAFKA_BROKERS: ""
      JSL_AUTHZ_MODE: "jwks"
      # M19：iss 用浏览器面 URL（与令牌 iss 一致），backchannel 直连 Keycloak 内部端口
      # （APISIX 在 tenant-bc 之后启动，依赖顺序导致 apisix 主机名不可达）
      JSL_AUTHZ_ISSUER: "http://localhost:9080/realms/jsl"
      JSL_AUTHZ_BACKCHANNEL_BASE: "http://keycloak:8080/realms/jsl"
      JSL_AUTHZ_AUDIENCE: "jsl-gateway"
      JSL_AUTHZ_TENANT_CLAIM: "tenant_id"
      OTEL_EXPORTER_OTLP_ENDPOINT: ""
    depends_on:
      keycloak:
        condition: service_healthy
