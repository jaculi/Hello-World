# kind/k3d 本地集群部署覆盖值（步 24）：内存模式、单副本、关 HPA。
# 前置：kubectl create secret generic tenant-bc-secrets \
#        --from-literal=JSL_AUTHZ_JWT_SECRET=dev-kind-secret
# 部署：helm install tenant-bc deploy/helm/tenant-bc -f deploy/dev/tenant-bc-dev-values.yaml
replicaCount: 1
image:
  repository: jsl/tenant-bc
  tag: v0.0.1
  pullPolicy: Never      # kind load 导入的本地镜像

env:
  JSL_ENV: "dev"         # dev：无 JSL_DB_DSN 走内存替身，无 Kafka 仅告警
  JSL_KAFKA_BROKERS: ""
  JSL_KAFKA_TOPIC: "platform.events.v1"
  JSL_OUTBOX_INTERVAL: "2s"
  OTEL_EXPORTER_OTLP_ENDPOINT: ""
  # ── M19/M20 认证：JWKS 远程验签（Keycloak 签发，APISIX 已验一次，BC 二次校验）──
  # issuer 与浏览器面一致（KC_HOSTNAME 锁定）；JWKS 发现经 backchannel 直连集群内
  # Keycloak Service（Port 80），绕开对 APISIX 的依赖。
  JSL_AUTHZ_MODE: "jwks"
  JSL_AUTHZ_ISSUER: "http://auth.localtest.me:8080/realms/jsl"
  JSL_AUTHZ_AUDIENCE: "jsl-gateway"
  JSL_AUTHZ_TENANT_CLAIM: "tenant_id"
  JSL_AUTHZ_BACKCHANNEL_BASE: "http://keycloak.keycloak.svc.cluster.local/realms/jsl"

existingSecret: "tenant-bc-secrets"
autoscaling:
  enabled: false
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi
