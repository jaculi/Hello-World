# Kyverno Helm 安装 values（M7）
# 仅覆盖与镜像验证相关的最小配置；其余取 chart 默认。
# 安装：helm install kyverno kyverno/kyverno -n kyverno --create-namespace -f deploy/kyverno/values.yaml
#
# 镜像验证依赖：Kyverno 需能访问目标镜像仓库（GHCR）与 Rekor（https://rekor.sigstore.dev）。

# 启用镜像验证 webhook（Kyverno 默认开启，显式声明以固定行为）
verifyImages:
  # 签名验证失败时拒绝（fail-closed，BP-05 运行时安全原则）
  validationFailureAction: Enforce

resources:
  limits:
    memory: 768Mi
  requests:
    cpu: 100m
    memory: 256Mi
