# 强制 Deployment 多副本（M17 / BP-04 高可用）
#
# 强制 platform 命名空间 Deployment 副本数 >= 2，避免单副本 Pod 故障导致服务中断。
# HPA 管理的 Deployment 同样受此约束（HPA minReplicas 也应 >= 2）。
# 例外：批处理/一次性任务用 CronJob/Job，不适用本策略。
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-deployment-multi-replicas
  annotations:
    policies.kyverno.io/title: 强制 Deployment 多副本
    policies.kyverno.io/category: Reliability
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Deployment
spec:
  validationActions: [Deny]
  failurePolicy: Fail
  webhookConfiguration:
    timeoutSeconds: 10
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: platform
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        resources: ["deployments"]
        operations: ["CREATE", "UPDATE"]
  validations:
    - expression: >-
        object.spec.?replicas.orValue(1) >= 2
      message: "Deployment 副本数必须 >= 2（高可用），单副本服务故障即中断"
  evaluation:
    background:
      enabled: false
    admission:
      enabled: true
