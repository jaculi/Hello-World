# 禁止 root 用户运行（M14 / BP-05 纵深防御）
#
# 强制 platform 命名空间的容器不以 root（UID 0）运行。
# PSS restricted 已要求 runAsNonRoot=true，本策略作为纵深防御补充：
# 显式禁止 runAsUser=0，防止 runAsNonRoot 被绕过（如 runAsNonRoot=true 但 runAsUser=0 的矛盾配置）。
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-run-as-root
  annotations:
    policies.kyverno.io/title: 禁止 root 用户运行
    policies.kyverno.io/category: Pod Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
spec:
  validationActions: [Deny]
  failurePolicy: Fail
  webhookConfiguration:
    timeoutSeconds: 15
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: platform
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["pods"]
        operations: ["CREATE", "UPDATE"]
  validations:
    - expression: >-
        object.spec.containers.all(c,
          c.?securityContext.?runAsUser.orValue(-1) != 0
        )
      message: "容器禁止以 root（runAsUser=0）运行，须指定非零 UID"
    - expression: >-
        (object.spec.?initContainers.orValue([])).all(c,
          c.?securityContext.?runAsUser.orValue(-1) != 0
        )
      message: "初始化容器禁止以 root（runAsUser=0）运行"
    - expression: >-
        (object.spec.?ephemeralContainers.orValue([])).all(c,
          c.?securityContext.?runAsUser.orValue(-1) != 0
        )
      message: "临时容器禁止以 root（runAsUser=0）运行"
  evaluation:
    background:
      enabled: true
    admission:
      enabled: true
