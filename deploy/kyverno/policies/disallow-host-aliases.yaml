# 禁止 hostAlias（M14 / BP-05 网络安全）
#
# 禁止 Pod 设置 spec.hostAliases，防止 DNS 劫持与绕过集群服务发现。
# 域名解析须经集群 CoreDNS，禁止在 Pod 层面硬编码主机名→IP 映射。
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-host-aliases
  annotations:
    policies.kyverno.io/title: 禁止 hostAlias
    policies.kyverno.io/category: Network Security
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
spec:
  validationActions: [Deny]
  failurePolicy: Fail
  webhookConfiguration:
    timeoutSeconds: 10
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: platform
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["pods"]
        operations: ["CREATE", "UPDATE"]
  validations:
    - expression: >-
        object.spec.?hostAliases.orValue([]).size() == 0
      message: "禁止设置 spec.hostAliases，域名解析须经集群 CoreDNS"
  evaluation:
    background:
      enabled: true
    admission:
      enabled: true
