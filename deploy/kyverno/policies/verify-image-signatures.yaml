# Kyverno 镜像签名校验策略（M7 / BP-05 §7.1.2 供应链安全运行时准入）
#
# 作用：运行时强制 Pod 镜像必须经过 cosign keyless 签名，且签名来源可信
# （Fulcio 证书的 OIDC 发行者 = GitHub Actions，身份 = 本仓 workflow）。
# 这是 CI 侧 cosign 签名（.github/workflows/ci.yml ⑤ 制品 job）的消费端。
#
# 匹配范围：ghcr.io/jaculi/tenant-bc:*（BC-P1 首个服务）。
# 上线更多 BC 时，将 imageReferences 扩展为 "ghcr.io/jaculi/*:*"。
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-image-signatures
  annotations:
    policies.kyverno.io/title: 验证 cosign keyless 镜像签名
    policies.kyverno.io/category: Supply Chain Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      要求 ghcr.io/jaculi/tenant-bc 镜像具备由 GitHub Actions OIDC 签发的
      cosign keyless 签名，防止未签名或被篡改的镜像进入集群。
spec:
  validationFailureAction: Enforce
  webhookTimeoutSeconds: 30
  failurePolicy: Fail
  rules:
    - name: verify-tenant-bc-cosign-keyless
      match:
        any:
          - resources:
              kinds:
                - Pod
      verifyImages:
        - imageReferences:
            - "ghcr.io/jaculi/tenant-bc:*"
          mutateDigest: true
          attestors:
            - entries:
                - keyless:
                    # 与 CI 中 cosign verify 的发行者/身份约束一致
                    issuer: https://token.actions.githubusercontent.com
                    subject: https://github.com/jaculi/Hello-World/*
                    # 公共 Rekor 透明日志（签名落 Rekor，验证时校验存在性）
                    rekor:
                      url: https://rekor.sigstore.dev
          verifyDigest: true
