# Kyverno 镜像签名校验策略（M10 CEL 迁移 / BP-05 §7.1.2 供应链安全运行时准入）
#
# 从 M9 的 ClusterPolicy（kyverno.io/v1，已被 Kyverno v1.19 标记废弃）
# 迁移至 CEL ImageValidatingPolicy（policies.kyverno.io/v1）。
#
# 作用：运行时强制 Pod 镜像必须经过 cosign keyless 签名，且签名来源可信
# （Fulcio 证书的 OIDC 发行者 = GitHub Actions，身份 = 本仓 workflow）。
# 这是 CI 侧 cosign 签名（.github/workflows/ci.yml ⑤ 制品 job）的消费端。
#
# imageReferences 为平台全域通配 `ghcr.io/jaculi/*:*`——monorepo 内所有 BC
# （含后续插件行业服务）镜像自动纳入签名校验，新 BC 落地无需修改本策略。
apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: verify-image-signatures
  annotations:
    policies.kyverno.io/title: 验证平台镜像 cosign keyless 签名
    policies.kyverno.io/category: Supply Chain Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
spec:
  # 准入侧 fail-closed：校验失败拒绝；webhook 失效（failurePolicy: Fail）也拒绝
  validationActions: [Deny]
  failurePolicy: Fail
  webhookConfiguration:
    timeoutSeconds: 30
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["pods"]
        operations: ["CREATE", "UPDATE"]
  # 仅校验平台仓库镜像；非匹配镜像（如第三方 sidecar）跳过，不阻断
  matchImageReferences:
    - glob: "ghcr.io/jaculi/*:*"
  attestors:
    - name: cosign
      cosign:
        keyless:
          # 与 CI 中 cosign verify 的发行者/身份约束一致
          # 注意：CEL keyless identities.subject 为严格匹配（不支持通配符），
          # 必须用 subjectRegExp 正则匹配 GitHub Actions 签发身份。
          identities:
            - issuer: https://token.actions.githubusercontent.com
              subjectRegExp: "^https://github\\.com/jaculi/Hello-World/\\.github/workflows/.*"
        # 公共 Rekor 透明日志（签名落 Rekor，验证时校验存在性）
        ctlog:
          url: https://rekor.sigstore.dev
  validations:
    # images.containers 为 CEL 内置变量，自动提取 Pod 全部容器镜像字符串
    # verifyImageSignatures 对匹配 matchImageReferences 的镜像做 cosign keyless 校验
    - expression: >-
        images.containers.map(image, verifyImageSignatures(image, [attestors.cosign])).all(e, e > 0)
      message: "镜像未通过 cosign keyless 签名校验（GitHub Actions OIDC 签名来源不可信或镜像无签名）"
  validationConfigurations:
    # 验证通过后将标签替换为 digest，防标签重放攻击
    mutateDigest: true
    verifyDigest: true
    # 强制匹配镜像必须通过签名校验
    required: true
  evaluation:
    # 后台扫描存量 Pod，生成 PolicyReport
    background:
      enabled: true
    admission:
      enabled: true
