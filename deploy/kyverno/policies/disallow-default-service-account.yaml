# 禁止使用 default ServiceAccount（M15 / BP-05 纵深防御·最小权限）
#
# 禁止 platform 命名空间的 Pod 使用 default ServiceAccount。
# default SA 权限最小但语义不明，业务 Pod 须显式绑定专用 SA 并授予最小权限。
# 此策略与 disable-automount-sa-token 协同：前者禁止挂载 token，后者禁止使用 default SA。
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-default-service-account
  annotations:
    policies.kyverno.io/title: 禁止使用 default ServiceAccount
    policies.kyverno.io/category: RBAC
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
spec:
  validationActions: [Deny]
  failurePolicy: Fail
  webhookConfiguration:
    timeoutSeconds: 10
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: platform
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["pods"]
        operations: ["CREATE", "UPDATE"]
  validations:
    - expression: >-
        object.spec.?serviceAccountName.orValue('default') != 'default'
      message: "禁止使用 default ServiceAccount，须显式指定专用 SA 并授予最小权限"
  evaluation:
    background:
      enabled: true
    admission:
      enabled: true
