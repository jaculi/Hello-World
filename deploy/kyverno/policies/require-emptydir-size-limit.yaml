# 强制 emptyDir 大小限制（M16 / BP-04 资源治理）
#
# 强制 platform 命名空间的 Pod 中 emptyDir 卷必须设置 sizeLimit，
# 防止临时存储无限制增长导致节点磁盘耗尽与调度失衡。
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-emptydir-size-limit
  annotations:
    policies.kyverno.io/title: 强制 emptyDir 大小限制
    policies.kyverno.io/category: Resource Management
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
spec:
  validationActions: [Deny]
  failurePolicy: Fail
  webhookConfiguration:
    timeoutSeconds: 10
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: platform
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["pods"]
        operations: ["CREATE", "UPDATE"]
  validations:
    - expression: >-
        (object.spec.?volumes.orValue([]))
          .filter(v, v.?emptyDir.orValue(null) != null)
          .all(v, v.emptyDir.?sizeLimit.orValue(null) != null)
      message: "emptyDir 卷必须设置 sizeLimit，防止节点磁盘耗尽"
  evaluation:
    background:
      enabled: true
    admission:
      enabled: true
