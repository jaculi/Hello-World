# 禁止通配符 RBAC 权限（M15 / BP-05 默认拒绝·最小权限）
#
# 禁止 Role/ClusterRole 中使用通配符权限：
#   - verbs 包含 "*"（所有操作）
#   - resources 包含 "*"（所有资源）
#   - apiGroups 包含 "*"（所有 API 组）
# 通配符权限违背最小权限原则，须显式声明所需权限。
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-wildcard-rbac
  annotations:
    policies.kyverno.io/title: 禁止通配符 RBAC 权限
    policies.kyverno.io/category: RBAC
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Role
spec:
  validationActions: [Deny]
  failurePolicy: Fail
  webhookConfiguration:
    timeoutSeconds: 10
  matchConstraints:
    resourceRules:
      - apiGroups: ["rbac.authorization.k8s.io"]
        apiVersions: ["v1"]
        resources: ["roles", "clusterroles"]
        operations: ["CREATE", "UPDATE"]
  validations:
    - expression: >-
        object.rules.all(rule,
          !rule.?verbs.orValue([]).exists(v, v == '*') &&
          !rule.?resources.orValue([]).exists(r, r == '*') &&
          !rule.?apiGroups.orValue([]).exists(g, g == '*')
        )
      message: "禁止使用通配符 RBAC 权限（verbs/resources/apiGroups 含 '*'），须显式声明最小权限"
  evaluation:
    background:
      enabled: false
    admission:
      enabled: true
