# platform 命名空间镜像允许清单（M10 CEL 迁移 / BP-05 默认拒绝原则）
#
# 从 M9 的 ClusterPolicy（kyverno.io/v1，已废弃）迁移至 CEL ValidatingPolicy
# （policies.kyverno.io/v1）。
#
# 作用：纵深防御第二道闸——签名校验（verify-image-signatures）只约束"平台镜像必须可信签"，
# 本策略反向收敛"platform 命名空间只能运行平台仓库镜像"：任何第三方镜像（含
# Docker Hub/Quay 等）一律拒绝，防止业务 Pod 夹带未纳入供应链治理的镜像。
# 第三方组件（如网关、观测栈）部署在各自命名空间，不受影响；确需引入时走例外评审。
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: platform-registry-allowlist
  annotations:
    policies.kyverno.io/title: platform 命名空间镜像允许清单
    policies.kyverno.io/category: Supply Chain Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
spec:
  validationActions: [Deny]
  failurePolicy: Fail
  webhookConfiguration:
    timeoutSeconds: 30
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: platform
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["pods"]
        operations: ["CREATE", "UPDATE"]
  validations:
    # CEL 直接遍历容器列表；init/ephemeral 容器缺省时用 orValue([]) 回退，
    # 避免对无 init 容器的普通 Pod 误判拒绝（M9 已踩坑的同类问题，CEL 写法天然规避）。
    - expression: >-
        object.spec.containers.all(c, c.image.startsWith('ghcr.io/jaculi/'))
      message: "platform 命名空间仅允许 ghcr.io/jaculi/* 平台镜像（BP-05 默认拒绝；第三方组件部署于独立命名空间，例外走评审）"
    - expression: >-
        (object.spec.?initContainers.orValue([])).all(c, c.image.startsWith('ghcr.io/jaculi/'))
      message: "platform 命名空间初始化容器同样仅允许 ghcr.io/jaculi/* 平台镜像"
    - expression: >-
        (object.spec.?ephemeralContainers.orValue([])).all(c, c.image.startsWith('ghcr.io/jaculi/'))
      message: "platform 命名空间临时容器同样仅允许 ghcr.io/jaculi/* 平台镜像"
  evaluation:
    background:
      enabled: true
    admission:
      enabled: true
