# Keycloak realm 导入 ConfigMap（M18）。
# 内容源自 ../jsl-realm.json（compose 直接挂载该文件；集群经本 ConfigMap 挂载）。
# 注意：Keycloak --import-realm 仅在 realm 不存在时导入；realm 变更需删 realm 重导。
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm-import
  labels:
    app.kubernetes.io/part-of: jsl-platform
data:
  jsl-realm.json: |
    {
      "realm": "jsl",
      "enabled": true,
      "accessTokenLifespan": 300,
      "sslRequired": "none",
      "roles": {
        "realm": [
          { "name": "TENANT_ADMIN" },
          { "name": "PLATFORM_ADMIN" }
        ]
      },
      "clients": [
        {
          "clientId": "jsl-gateway",
          "enabled": true,
          "protocol": "openid-connect",
          "publicClient": false,
          "secret": "dev-gateway-secret",
          "standardFlowEnabled": true,
          "directAccessGrantsEnabled": true,
          "redirectUris": ["http://localhost:9080/*", "http://localhost:3000/*", "http://portal.localtest.me:8080/*"],
          "webOrigins": ["+"],
          "protocolMappers": [
            {
              "name": "tenant-id",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-attribute-mapper",
              "consentRequired": false,
              "config": {
                "user.attribute": "tenant_id",
                "claim.name": "tenant_id",
                "jsonType.label": "String",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true",
                "multivalued": "false"
              }
            },
            {
              "name": "client-audience",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-audience-mapper",
              "consentRequired": false,
              "config": {
                "included.client.audience": "jsl-gateway",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "lightweight.claim": "false"
              }
            }
          ]
        }
      ],
      "users": [
        {
          "username": "demo-admin",
          "enabled": true,
          "emailVerified": true,
          "email": "demo-admin@example.com",
          "credentials": [
            { "type": "password", "value": "dev", "temporary": false }
          ],
          "attributes": {
            "tenant_id": ["01JSM18DEM0TENANT000000001"]
          },
          "realmRoles": ["TENANT_ADMIN"]
        }
      ]
    }
