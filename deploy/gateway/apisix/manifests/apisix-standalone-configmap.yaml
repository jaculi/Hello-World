# APISIX standalone 配置 ConfigMap（M18 + M20 hostname 分流）。
# 键名与挂载 subPath 对应 deploy/gateway/apisix/{config,apisix}.yaml；
# 修改路由后由 ArgoCD 同步 + APISIX standalone 文件热加载。
#
# M20：双 hostname 路由（portal.localtest.me → 门户，auth.localtest.me → Keycloak/API）。
# compose 侧（deploy/gateway/apisix/apisix.yaml）不分 hostname，仍端口 9080 路径分流。
apiVersion: v1
kind: ConfigMap
metadata:
  name: apisix-standalone-config
  labels:
    app.kubernetes.io/part-of: jsl-platform
data:
  config.yaml: |
    deployment:
      role: data_plane
      role_data_plane:
        config_provider: yaml
    apisix:
      node_listen: 9080
    nginx:
      worker_processes: 2
    plugins:
      - openid-connect
      - serverless-pre-function
      - proxy-rewrite
  # 注意：upstream 主机名为集群内 Service DNS（keycloak.keycloak.svc / tenant-bc.platform.svc），
  # 与 compose 网络的短名不同；集群侧路由在此维护。
  apisix.yaml: |
    routes:
      - id: portal
        uri: /*
        hosts: ["portal.localtest.me"]
        plugins:
          proxy-rewrite:
            # M20 修正：APISIX 默认 X-Forwarded-Host 取 $host（去掉端口），
            # 与浏览器 Origin 头（portal.localtest.me:8080）不匹配，
            # 触发 Next.js Server Actions "Invalid Server Actions request" 中止。
            # 改用 $http_host（保留端口）保证二者一致。
            headers:
              set:
                X-Forwarded-Host: "$http_host"
        upstream:
          type: roundrobin
          nodes:
            "tenant-portal.platform.svc.cluster.local:3000": 1

      - id: keycloak-realms
        uri: /realms/*
        hosts: ["auth.localtest.me"]
        upstream:
          type: roundrobin
          nodes:
            "keycloak.keycloak.svc.cluster.local:80": 1

      - id: keycloak-resources
        uri: /resources/*
        hosts: ["auth.localtest.me"]
        upstream:
          type: roundrobin
          nodes:
            "keycloak.keycloak.svc.cluster.local:80": 1

      - id: platform-api
        uri: /api/*
        hosts: ["auth.localtest.me"]
        plugins:
          proxy-rewrite:
            regex_uri: ["^/api/(.*)", "/$1"]
          openid-connect:
            discovery: http://keycloak.keycloak.svc.cluster.local/realms/jsl/.well-known/openid-configuration
            client_id: jsl-gateway
            client_secret: dev-gateway-secret
            bearer_only: true
            realm: jsl
            set_access_token_header: true
          serverless-pre-function:
            phase: rewrite
            functions:
              - |
                return function(conf, ctx)
                  local core = require("apisix.core")
                  local auth = core.request.header(ctx, "Authorization")
                  if not auth then return end
                  local token = auth:gsub("^Bearer%s+", "")
                  local payload = token:match("^[^.]+%.([^.]+)%.[^.]+$")
                  if not payload then return end
                  local b64 = require("ngx.base64")
                  local ok, decoded = pcall(b64.decode_base64url, payload)
                  if not ok or not decoded then return end
                  local okj, claims = pcall(core.json.decode, decoded)
                  if okj and claims and claims.tenant_id then
                    core.request.set_header(ctx, "X-Tenant-Id", claims.tenant_id)
                  end
                end
        upstream:
          type: roundrobin
          nodes:
            "tenant-bc.platform.svc.cluster.local:8000": 1
    #END
